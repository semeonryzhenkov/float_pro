{% extends "base.html" %}

{% block title %}{{ project.name }} - Editor{% endblock %}

{% block content %}
<div class="editor-container">
    <div class="toolbar">
        <button class="tool-btn active" data-tool="select">Select</button>
        <button class="tool-btn" data-tool="wall">Wall</button>
        <button class="tool-btn" data-tool="window">Window</button>
        <button class="tool-btn" data-tool="door">Door</button>
        <button class="tool-btn" data-tool="room">Room Label</button>
        <div class="toolbar-separator"></div>
        <button id="saveBtn" class="btn btn-primary">Save</button>
        <button id="exportPngBtn" class="btn">Export PNG</button>
        <button id="exportJsonBtn" class="btn">Export JSON</button>
        <a href="{{ url_for('dashboard') }}" class="btn">Back</a>
    </div>
    <div class="canvas-wrapper">
        <canvas id="mainCanvas" width="2000" height="2000"></canvas>
    </div>
    <div class="info-panel">
        <h3>Project: {{ project.name }}</h3>
        <p>Walls: <span id="wallCount">0</span></p>
        <p>Windows: <span id="windowCount">0</span></p>
        <p>Doors: <span id="doorCount">0</span></p>
        <p>Rooms: <span id="roomCount">0</span></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
<script>
const projectId = {{ project.id }};
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const toolBtns = document.querySelectorAll('.tool-btn');
const saveBtn = document.getElementById('saveBtn');
const exportPngBtn = document.getElementById('exportPngBtn');
const exportJsonBtn = document.getElementById('exportJsonBtn');

let currentTool = 'select';
let data = {walls: [], windows: [], doors: [], rooms: [], labels: []};

toolBtns.forEach(btn => {
    btn.addEventListener('click', function() {
        toolBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentTool = this.dataset.tool;
    });
});

async function loadData() {
    try {
        const res = await fetch('/api/project/' + projectId);
        const proj = await res.json();
        data = proj.data;
        if (!data.walls) data.walls = [];
        if (!data.windows) data.windows = [];
        if (!data.doors) data.doors = [];
        if (!data.rooms) data.rooms = [];
        if (!data.labels) data.labels = [];
        redraw();
    } catch (err) {
        console.error('Load error:', err);
    }
}

async function saveData() {
    try {
        await fetch('/api/project/' + projectId, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data})
        });
        alert('Saved!');
    } catch (err) {
        alert('Save error');
    }
}

function redraw() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    
    data.walls.forEach(w => {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.stroke();
    });
    
    data.windows.forEach(win => {
        ctx.fillStyle = 'lightblue';
        ctx.strokeStyle = 'blue';
        ctx.fillRect(win.x - 10, win.y - 5, 20, 10);
        ctx.strokeRect(win.x - 10, win.y - 5, 20, 10);
    });
    
    data.doors.forEach(door => {
        ctx.beginPath();
        ctx.arc(door.x, door.y, 15, 0, Math.PI / 2);
        ctx.strokeStyle = 'brown';
        ctx.lineWidth = 3;
        ctx.stroke();
    });
    
    data.labels.forEach(lbl => {
        ctx.fillStyle = '#333';
        ctx.font = '16px Arial';
        ctx.fillText(lbl.text, lbl.x, lbl.y);
    });
    
    detectRooms();
    updateCounts();
}

function drawGrid() {
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function snap(val) {
    return Math.round(val / 10) * 10;
}

function detectRooms() {
    data.rooms = [];
    const walls = data.walls;
    if (walls.length < 3) return;
    
    const points = [];
    walls.forEach(w => {
        points.push({x: w.x1, y: w.y1});
        points.push({x: w.x2, y: w.y2});
    });
    
    const uniquePoints = [];
    points.forEach(p => {
        const exists = uniquePoints.some(up => Math.abs(up.x - p.x) < 5 && Math.abs(up.y - p.y) < 5);
        if (!exists) uniquePoints.push(p);
    });
    
    if (uniquePoints.length >= 3) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        uniquePoints.forEach(p => {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
        });
        
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        
        if (!data.rooms.some(r => Math.abs(r.x - cx) < 50 && Math.abs(r.y - cy) < 50)) {
            data.rooms.push({x: cx, y: cy, name: 'Room ' + (data.rooms.length + 1)});
        }
    }
    
    data.rooms.forEach(room => {
        ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
        ctx.beginPath();
        ctx.arc(room.x, room.y, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'green';
        ctx.font = '14px Arial';
        ctx.fillText(room.name, room.x - 20, room.y);
    });
}

function updateCounts() {
    document.getElementById('wallCount').textContent = data.walls.length;
    document.getElementById('windowCount').textContent = data.windows.length;
    document.getElementById('doorCount').textContent = data.doors.length;
    document.getElementById('roomCount').textContent = data.rooms.length;
}

let isDrawing = false;
let startX, startY;
let currentWall = null;

canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    if (currentTool === 'wall') {
        isDrawing = true;
        startX = snap(x);
        startY = snap(y);
    } else if (currentTool === 'window') {
        data.windows.push({x: snap(x), y: snap(y)});
        redraw();
    } else if (currentTool === 'door') {
        data.doors.push({x: snap(x), y: snap(y)});
        redraw();
    } else if (currentTool === 'room') {
        const text = prompt('Room name:');
        if (text) {
            data.labels.push({x: snap(x), y: snap(y), text});
            redraw();
        }
    } else if (currentTool === 'select') {
        selectElement(x, y);
    }
});

canvas.addEventListener('mousemove', e => {
    if (!isDrawing || currentTool !== 'wall') return;
    
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    currentWall = {x1: startX, y1: startY, x2: snap(x), y2: snap(y)};
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    data.walls.forEach(w => {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.stroke();
    });
    if (currentWall) {
        ctx.beginPath();
        ctx.moveTo(currentWall.x1, currentWall.y1);
        ctx.lineTo(currentWall.x2, currentWall.y2);
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 4;
        ctx.stroke();
    }
});

canvas.addEventListener('mouseup', () => {
    if (isDrawing && currentWall) {
        data.walls.push(currentWall);
        currentWall = null;
        redraw();
    }
    isDrawing = false;
});

function selectElement(x, y) {
    let found = false;
    
    data.walls.forEach((w, i) => {
        const dist = pointToLineDist(x, y, w.x1, w.y1, w.x2, w.y2);
        if (dist < 10) {
            if (confirm('Delete this wall?')) {
                data.walls.splice(i, 1);
                redraw();
            }
            found = true;
        }
    });
    
    if (!found) {
        data.windows.forEach((win, i) => {
            if (Math.abs(win.x - x) < 15 && Math.abs(win.y - y) < 15) {
                if (confirm('Delete this window?')) {
                    data.windows.splice(i, 1);
                    redraw();
                }
                found = true;
            }
        });
    }
    
    if (!found) {
        data.doors.forEach((door, i) => {
            if (Math.abs(door.x - x) < 20 && Math.abs(door.y - y) < 20) {
                if (confirm('Delete this door?')) {
                    data.doors.splice(i, 1);
                    redraw();
                }
                found = true;
            }
        });
    }
    
    if (!found) {
        data.labels.forEach((lbl, i) => {
            if (Math.abs(lbl.x - x) < 50 && Math.abs(lbl.y - y) < 20) {
                const newText = prompt('Edit label:', lbl.text);
                if (newText === null) {
                    if (confirm('Delete label?')) {
                        data.labels.splice(i, 1);
                        redraw();
                    }
                } else {
                    lbl.text = newText;
                    redraw();
                }
                found = true;
            }
        });
    }
}

function pointToLineDist(px, py, x1, y1, x2, y2) {
    const A = px - x1;
    const B = py - y1;
    const C = x2 - x1;
    const D = y2 - y1;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let param = -1;
    if (lenSq !== 0) param = dot / lenSq;
    let xx, yy;
    if (param < 0) {
        xx = x1;
        yy = y1;
    } else if (param > 1) {
        xx = x2;
        yy = y2;
    } else {
        xx = x1 + param * C;
        yy = y1 + param * D;
    }
    const dx = px - xx;
    const dy = py - yy;
    return Math.sqrt(dx * dx + dy * dy);
}

saveBtn.addEventListener('click', saveData);
exportPngBtn.addEventListener('click', () => window.open('/api/project/' + projectId + '/export/png'));
exportJsonBtn.addEventListener('click', () => window.open('/api/project/' + projectId + '/export/json'));

loadData();
</script>
{% endblock %}
